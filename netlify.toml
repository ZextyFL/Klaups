# The Next.js site lives in apps/web; everything Netlify builds/deploys is
# scoped there. The TikTok/Spotify worker (apps/worker) is NOT deployed by
# Netlify — it needs a persistent process, see apps/worker/README.md.
[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Payouts are manual SEPA transfers requested by creators and processed by
# the Klaups team at /admin/payouts — there is no scheduled payout job.
